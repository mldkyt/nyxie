<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Captcha</title>
</head>
<body>
<h1>To view this webpage please verify using a captcha</h1>
<p>This is to prevent scrapers and bad actors. You won't have to validate for each request.</p>
<form method="post">
  <label
      data-mcaptcha_url="{{mcaptcha_domain}}"
      for="mcaptcha__token"
      id="mcaptcha__token-label"
    >
      mCaptcha authorization token.
      <a
        href="https://mcaptcha.org/docs/user-manual/how-to-mcaptcha-without-js/"
        >Instructions</a
      >.
      <input type="text" name="mcaptcha__token" id="mcaptcha__token" />
    </label>
    <div id="mcaptcha__widget-container"></div>
    <script src="https://unpkg.com/@mcaptcha/vanilla-glue@0.1.0-rc2/dist/index.js"></script>

  <button type="submit">Verify</button>
</form>
</body>
</html>
